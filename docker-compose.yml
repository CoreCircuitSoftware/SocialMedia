# docker-compose.yml
# Universal configuration - works for both local and RDS

services:
  # MySQL Database (ONLY for local development)
  # Disable this when using RDS by setting USE_LOCAL_DB=false in .env
  db:
    image: mysql:8.0
    container_name: circuitsocial-db_local
    restart: always
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-circuitsocial-db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${DATABASE_USER:-django_user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-django_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Only start if USE_LOCAL_DB=true
    profiles:
      - local

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialmedia_backend
    restart: always
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-1}
      - DATABASE_HOST=${DATABASE_HOST:-db}
      - DATABASE_NAME=${DATABASE_NAME:-circuitsocial-db}
      - DATABASE_USER=${DATABASE_USER:-django_user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-django_password}
      - DATABASE_PORT=${DATABASE_PORT:-3306}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-^2@x*gq%d9em7xjz#pc^=%*pkl7t_dut_$-i7_1cb91ni^1o_x}
    # Only depend on db if using local database
    depends_on:
      db:
        condition: service_healthy
        required: false
    networks:
      - network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: socialmedia_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - network
    stdin_open: true
    tty: true

networks:
  network:
    driver: bridge

volumes:
  mysql_data:
  static_volume:
  media_volume:
