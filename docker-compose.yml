version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: socialmedia_db
    restart: always
    environment:
      MYSQL_DATABASE: socialmedia_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: django_user
      MYSQL_PASSWORD: django_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - socialmedia_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialmedia_backend
    restart: always
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_HOST=db
      - DATABASE_NAME=socialmedia_db
      - DATABASE_USER=django_user
      - DATABASE_PASSWORD=django_password
      - DATABASE_PORT=3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - socialmedia_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: socialmedia_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://127.0.0.1:8000
      - VITE_MESSAGE_URL=127.0.0.1:8000
    depends_on:
      - backend
    networks:
      - socialmedia_network
    stdin_open: true
    tty: true

  # Nginx (Optional - for production)
  # nginx:
  #   image: nginx:alpine
  #   container_name: socialmedia_nginx
  #   restart: always
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #     - static_volume:/app/staticfiles
  #     - media_volume:/app/media
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - socialmedia_network

networks:
  socialmedia_network:
    driver: bridge

volumes:
  mysql_data:
  static_volume:
  media_volume:
